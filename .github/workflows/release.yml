# Publishing a GitHub release tagged v<version> builds the app binary for each
# platform, attaches the binaries to the release, then publishes the package
# to npm. The npm publish comes last so `npx @fingerskier/edit` never resolves
# to a version whose binaries are not downloadable yet.
#
# Requires the repository secret NPM_TOKEN (an automation token with publish
# rights on the @fingerskier scope).

name: Release

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  check:
    name: Tag matches package version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          version="$(node -p "require('./package.json').version")"
          if [ "v$version" != "${{ github.event.release.tag_name }}" ]; then
            echo "Release tag ${{ github.event.release.tag_name }} does not match package.json version $version" >&2
            exit 1
          fi

  binaries:
    name: Build ${{ matrix.asset }}
    needs: check
    strategy:
      fail-fast: true
      matrix:
        include:
          - { os: ubuntu-22.04, target: x86_64-unknown-linux-gnu, asset: fedit-linux-x64, bin: fedit }
          - { os: ubuntu-22.04-arm, target: aarch64-unknown-linux-gnu, asset: fedit-linux-arm64, bin: fedit }
          - { os: macos-latest, target: aarch64-apple-darwin, asset: fedit-macos-arm64, bin: fedit }
          - { os: macos-latest, target: x86_64-apple-darwin, asset: fedit-macos-x64, bin: fedit }
          - { os: windows-latest, target: x86_64-pc-windows-msvc, asset: fedit-windows-x64.exe, bin: fedit.exe }
          - { os: windows-latest, target: aarch64-pc-windows-msvc, asset: fedit-windows-arm64.exe, bin: fedit.exe }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - run: npm ci
      - run: npx tauri build --no-bundle --target ${{ matrix.target }}
      - name: Upload to the release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp "src-tauri/target/${{ matrix.target }}/release/${{ matrix.bin }}" "${{ matrix.asset }}"
          gh release upload "${{ github.event.release.tag_name }}" "${{ matrix.asset }}" --clobber

  npm:
    name: Publish to npm
    needs: binaries
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # npm provenance
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          cache: npm
      - run: npm ci
      - run: npm publish --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
